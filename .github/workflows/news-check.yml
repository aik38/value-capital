name: Verify news integration without deployment
on:
  pull_request:
  push:
    branches: ['work/ma-news-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: node scripts/check.mjs
