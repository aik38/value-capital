<header class="news-header"><p class="eyebrow">M&amp;A NEWS</p><h1>トクヤマ、スーパーナノデザインを吸収合併へ</h1><div class="news-meta"><time datetime="2026-10-24">2026-10-24</time></div></header>
<div class="news-body"><p>株式会社トクヤマ（4043）は、株式会社スーパーナノデザインを吸収合併する。トクヤマを存続会社、スーパーナノデザインを消滅会社とする。</p><p>目的は組織運営の効率化。合併の効力発生日は2027年2月1日を予定している。</p></div>
