<header class="news-header"><p class="eyebrow">M&amp;A NEWS</p><h1>美濃窯業、アイシー化工の全株式取得へ　非耐火物分野を強化</h1><div class="news-meta"><time datetime="2026-11-13">2026-11-13</time></div></header>
<div class="news-body"><p>美濃窯業（5356）は、アイシー化工の全株式を取得する。株式取得予定日は2026年11月16日で、取得総額は非公表。</p><p>建材原料の加工技術や設備を取り込み、育成を進める建材・舗装用材など非耐火物分野の強化につなげる。</p></div>
